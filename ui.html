<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="jszip.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    font-size: 13px;
    color: #1a1a1a;
    padding: 16px;
    background: #fff;
  }
  .plugin-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .plugin-header svg { flex-shrink: 0; }
  .plugin-description {
    font-size: 11px;
    color: #888;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .formats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
    transition: border-color 0.15s;
  }
  label:hover { border-color: #999; }
  label:has(input:checked) { border-color: #1a1a1a; background: #f5f5f5; }
  input[type="checkbox"] { accent-color: #1a1a1a; width: 14px; height: 14px; }
  .badge {
    font-size: 10px;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 3px;
    background: #e8e8e8;
    color: #555;
    margin-left: auto;
  }
  button {
    width: 100%;
    padding: 10px;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #status {
    margin-top: 10px;
    font-size: 12px;
    color: #666;
    min-height: 18px;
    text-align: center;
  }
  #status.error { color: #c0392b; }
  #status.ok { color: #27ae60; }
  .color-mode {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 8px;
  }
  .mode-label { font-weight: 500; color: #444; white-space: nowrap; }
  select {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    font-size: 12px;
    color: #1a1a1a;
    background: #fff;
    cursor: pointer;
  }
  select:focus { outline: none; border-color: #1a1a1a; }
</style>
</head>
<body>

<p class="plugin-description">Exlo exports your logos, components, or frames into multiple file formats at once — SVG, PDF, PNG 1×, PNG 2×, and JPG — bundled into a single ZIP, ready to hand off immediately. Select one frame or many. No repetition, no waiting.</p>

<div class="formats">
  <label><input type="checkbox" value="SVG" checked> SVG <span class="badge">vector</span></label>
  <label><input type="checkbox" value="PDF" checked> PDF <span class="badge">print</span></label>
  <label><input type="checkbox" value="PNG" checked> PNG 1× <span class="badge">raster</span></label>
  <label><input type="checkbox" value="PNG_2x"> PNG 2× <span class="badge">retina</span></label>
  <label><input type="checkbox" value="JPG"> JPG <span class="badge">photo</span></label>
</div>

<div class="color-mode">
  <label for="colorProfile" class="mode-label">Color mode</label>
  <select id="colorProfile">
    <option value="DOCUMENT">Document (default)</option>
    <option value="SRGB">sRGB</option>
    <option value="DISPLAY_P3">Display P3</option>
  </select>
</div>

<button id="btn">Export selection</button>
<div id="status"></div>

<script>
window.addEventListener('load', () => {
  parent.postMessage({ pluginMessage: { type: 'resize', height: document.body.scrollHeight } }, '*');
});

const mimeMap = { SVG: 'image/svg+xml', PNG: 'image/png', PNG_2x: 'image/png', PDF: 'application/pdf', JPG: 'image/jpeg' };
const extMap  = { SVG: 'svg', PNG: 'png', PNG_2x: 'png', PDF: 'pdf', JPG: 'jpg' };

const btn    = document.getElementById('btn');
const status = document.getElementById('status');
let pending  = [];

function setStatus(msg, type) {
  status.textContent = msg;
  status.className = type || '';
}

function triggerDownload(name, format, bytes) {
  const blob = new Blob([new Uint8Array(bytes)], { type: mimeMap[format] });
  const suffix = format === 'PNG_2x' ? '@2x' : '';
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob),
    download: `${name}${suffix}.${extMap[format]}`
  });
  a.click();
  URL.revokeObjectURL(a.href);
}

btn.addEventListener('click', () => {
  const formats = [...document.querySelectorAll('input:checked')].map(el => el.value);
  if (!formats.length) { setStatus('Pick at least one format.', 'error'); return; }
  pending = [];
  btn.disabled = true;
  setStatus('Exporting…');
  const colorProfile = document.getElementById('colorProfile').value;
  parent.postMessage({ pluginMessage: { type: 'export', formats, colorProfile } }, '*');
});

window.onmessage = async ({ data: { pluginMessage: m } }) => {
  if (!m) return;

  if (m.type === 'download') {
    pending.push(m);
  }

  if (m.type === 'error') {
    setStatus(m.msg, 'error');
    btn.disabled = false;
  }

  if (m.type === 'done') {
    if (pending.length === 0) {
      const errMsg = m.errors?.length ? `Failed: ${m.errors.join(', ')}` : 'Nothing exported.';
      setStatus(errMsg, 'error');
      btn.disabled = false;
      return;
    }

    if (pending.length === 1) {
      // Single frame, single format — direct download, no ZIP
      triggerDownload(pending[0].name, pending[0].format, pending[0].bytes);
    } else {
      // Multiple frames or formats — bundle into one ZIP
      setStatus('Zipping…');
      const zip = new JSZip();
      const seen = {};
      for (const f of pending) {
        const suffix = f.format === 'PNG_2x' ? '@2x' : '';
        const base = `${f.name}${suffix}.${extMap[f.format]}`;
        // ponytail: deduplicate — same frame name + format gets a counter suffix
        seen[base] = (seen[base] || 0) + 1;
        const filename = seen[base] > 1 ? base.replace(/(\.\w+)$/, `-${seen[base]}$1`) : base;
        zip.file(filename, new Uint8Array(f.bytes));
      }
      const blob = await zip.generateAsync({ type: 'blob' });
      const uniqueNames = new Set(pending.map(f => f.name));
      const zipName = uniqueNames.size === 1 ? `${pending[0].name}-exports.zip` : 'exports.zip';
      const a = Object.assign(document.createElement('a'), {
        href: URL.createObjectURL(blob),
        download: zipName
      });
      a.click();
      URL.revokeObjectURL(a.href);
    }
    pending = [];
    const errNote = m.errors?.length ? ` (${m.errors.length} skipped)` : '';
    setStatus(`Done ✓${errNote}`, 'ok');
    btn.disabled = false;
  }
};
</script>
</body>
</html>
